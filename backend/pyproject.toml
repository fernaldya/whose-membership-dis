[project]
name = "whose-membership-dis-backend"
version = "0.1.0"
description = "Membership tracking API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    "pydantic[email]>=2.7.0",
    "itsdangerous>=2.2.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
]
